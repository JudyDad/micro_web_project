name: Foundation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: micro_projects_test
          MYSQL_USER: micro_projects_test
          MYSQL_PASSWORD: ci-only
          MYSQL_ROOT_PASSWORD: ci-root-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer validate --strict
      - run: npm ci
      - run: npm run build
      - run: vendor/bin/pint --test
      - run: php artisan test
      - name: Verify isolated MySQL connection (no migrations)
        env:
          DB_PASSWORD: ci-only
        run: php artisan foundation:check-database
      - name: Verify approved schema lifecycle and constraints
        env:
          RUN_MYSQL_SCHEMA_TESTS: '1'
          MYSQL_TEST_HOST: '127.0.0.1'
          MYSQL_TEST_PORT: '3306'
          MYSQL_TEST_USERNAME: micro_projects_test
          MYSQL_TEST_PASSWORD: ci-only
        run: php vendor/phpunit/phpunit/phpunit tests/Integration/PreservationSchemaTest.php
